<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>感情存摺</title><style>body{margin:0;background:#d9d2bd;font-family:serif;color:#2a241a;padding:32px 16px}.passbook{max-width:620px;margin:auto;background:#f4efe0;box-shadow:0 18px 40px #0004}.cover{background:#5c1a28;color:#e3c583;padding:40px 36px 28px;border-bottom:6px solid #c79a4b}.eyebrow{font:11px monospace;letter-spacing:3px}.title{font-size:40px;font-weight:900;margin:12px 0 18px}.names{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}.names input{width:6.5em;background:transparent;border:0;border-bottom:1px dashed #e3c58380;color:#e3c583;font-size:19px;font-weight:700}.book-no{margin-top:22px;font:12px monospace}.lockbar{display:flex;justify-content:space-between;padding:10px 28px;background:#3c1019;color:#e3c583;font-size:12px}.lockbtn{background:transparent;border:1px solid #e3c583;color:#e3c583;border-radius:999px;padding:5px 13px}.balances{display:flex}.balance{flex:1;text-align:center;padding:24px 20px;border-bottom:1px solid #d8cfae}.balance:first-child{border-right:1px dashed #d8cfae}.bname{color:#6b6151}.score{font:700 40px monospace}.sub{font:11px monospace;color:#6b6151}.add{padding:22px 28px 26px;background:#eee7d3;border-bottom:1px solid #d8cfae}h2{font-size:15px}.row{display:flex;gap:8px;margin-bottom:12px}.btn{flex:1;padding:10px 8px;border:1.5px solid #d8cfae;background:#f4efe0}.btn.active{background:#5c1a28;color:#e3c583}.points{display:flex;align-items:center;gap:12px;margin-bottom:12px}.stepper{display:flex;border:1.5px solid #d8cfae}.stepper button{width:34px;border:0}.stepper input{width:46px;text-align:center;border:0}.input{width:100%;padding:10px 12px;margin-bottom:12px;border:1.5px solid #d8cfae;background:#f4efe0}.date{max-width:180px}.stamp{border:2px solid #8b2e2e;color:#8b2e2e;background:transparent;padding:10px 22px;border-radius:999px;font-weight:900}.ledger{padding:22px 0}.ledger h2{padding:0 28px}.empty{text-align:center;padding:40px;color:#6b6151}.entry{display:grid;grid-template-columns:88px 70px 1fr 48px 38px;gap:8px;padding:12px 20px 12px 28px;border-top:1px dashed #d8cfae;font-size:13px}.date{font:12px monospace;color:#6b6151}.person{font-weight:700}.mark{font-weight:900;padding:3px 8px;border:1.5px solid}.right{color:#2c4a3b}.wrong{color:#8b2e2e}.del{border:0;background:none;text-decoration:underline}@media(max-width:560px){body{padding:16px 8px}.cover{padding:30px 22px}.title{font-size:32px}.add{padding:20px 18px}.entry{grid-template-columns:70px 55px 1fr 38px}}</style></head>
<body><div class="passbook"><section class="cover"><div class="eyebrow">RELATIONSHIP PASSBOOK · 感情存摺</div><div class="title">感情存摺</div><div class="names"><input id="nameA" value="毛毛" maxlength="8"><span>×</span><input id="nameB" value="彤彤" maxlength="8"></div><div class="book-no">No. <span id="bookNo">毛毛·彤彤-0000</span></div></section><section class="lockbar"><span id="status">準備完成</span><button class="lockbtn" id="lockBtn" onclick="toggleLock()">解鎖編輯</button></section><section class="balances"><div class="balance"><div class="bname" id="bn0">毛毛</div><div class="score" id="s0">0</div><div class="sub"><span id="r0">0</span> 對 · <span id="w0">0</span> 錯</div></div><div class="balance"><div class="bname" id="bn1">彤彤</div><div class="score" id="s1">0</div><div class="sub"><span id="r1">0</span> 對 · <span id="w1">0</span> 錯</div></div></section><section class="add" id="addArea"><h2>◆ 新增一筆記錄</h2><div class="row"><button class="btn person active" data-person="0">毛毛</button><button class="btn person" data-person="1">彤彤</button><button class="btn type active" data-type="right">✓ 對</button><button class="btn type" data-type="wrong">× 錯</button></div><div class="points"><span>呢件事值幾多分</span><div class="stepper"><button onclick="changePoints(-1)">−</button><input id="points" type="number" min="1" max="99" value="1"><button onclick="changePoints(1)">＋</button></div></div><input class="input" id="desc" placeholder="呢件事係咩事？（例如：記得紀念日、講嘢冇禮貌...）"><input class="input date" id="date" type="date"><div><button class="stamp" onclick="addEntry()">蓋 印</button></div></section><section class="ledger"><h2>記錄</h2><div id="ledger" class="empty">存摺載入緊...</div></section><div style="padding:16px 28px 22px;color:#6b6151;font-size:11px">連結分享 · 毛毛 × 彤彤</div></div>
<script>const KEY='relationship-passbook-v2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[],person=0,type='right',locked=false,$=id=>document.getElementById(id);function init(){$('date').value=new Date().toISOString().slice(0,10);document.querySelectorAll('.person').forEach(b=>b.onclick=()=>{person=+b.dataset.person;document.querySelectorAll('.person').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active')});render()}function changePoints(n){$('points').value=Math.max(1,Math.min(99,+$('points').value+n))}function addEntry(){if(locked)return;let desc=$('desc').value.trim();if(!desc)return alert('請先寫低件事');data.push({id:Date.now(),person,type,points:Math.max(1,+$('points').value||1),desc,date:$('date').value});localStorage.setItem(KEY,JSON.stringify(data));$('desc').value='';$('points').value=1;render()}function removeEntry(id){if(locked)return;if(confirm('刪除呢筆記錄？')){data=data.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));render()}}function toggleLock(){locked=!locked;$('lockBtn').textContent=locked?'解鎖編輯':'鎖定編輯';$('status').textContent=locked?'目前為唯讀模式':'編輯模式已開啟'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){let s=[0,0],r=[0,0],w=[0,0];data.forEach(e=>{if(e.type==='right'){s[e.person]+=e.points;r[e.person]++}else{s[e.person]-=e.points;w[e.person]++}});$('bn0').textContent=$('nameA').value||'毛毛';$('bn1').textContent=$('nameB').value||'彤彤';$('s0').textContent=s[0];$('s1').textContent=s[1];$('r0').textContent=r[0];$('r1').textContent=r[1];$('w0').textContent=w[0];$('w1').textContent=w[1];document.querySelector('[data-person="0"]').textContent=$('nameA').value||'毛毛';document.querySelector('[data-person="1"]').textContent=$('nameB').value||'彤彤';$('bookNo').textContent=($('nameA').value||'毛毛')+'·'+($('nameB').value||'彤彤')+'-'+String(data.length).padStart(4,'0');$('ledger').innerHTML=data.length?data.slice().reverse().map(e=>'<div class="entry"><div class="date">'+e.date+'</div><div class="person">'+(e.person?($('nameB').value||'彤彤'):($('nameA').value||'毛毛'))+'</div><div>'+esc(e.desc)+'</div><div class="mark '+e.type+'">'+(e.type==='right'?'對 +':'錯 −')+e.points+'</div><button class="del" onclick="removeEntry('+e.id+')">刪</button></div>').join(''):'<div class="empty">存摺仲未有記錄。<br>新增第一筆記錄，開始你哋嘅感情存摺。</div>'}init();</script></body></html>
