<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感情存摺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cover:#5c1a28;--cover-dark:#431320;--gold:#c79a4b;--gold-light:#e3c583;--paper:#f4efe0;--paper2:#eee7d3;--line:#d8cfae;--ink:#2a241a;--soft:#6b6151;--right:#2c4a3b;--right-bg:#e3ecdf;--wrong:#8b2e2e;--wrong-bg:#f3e0dc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 16px 70px;background:#d9d2bd;background-image:radial-gradient(circle at 20% 10%,rgba(0,0,0,.04),transparent 40%),radial-gradient(circle at 80% 80%,rgba(0,0,0,.04),transparent 40%);font-family:'Noto Sans TC',sans-serif;color:var(--ink)}
.passbook{max-width:620px;margin:auto;background:var(--paper);border-radius:4px;overflow:hidden;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.25),0 2px 0 rgba(255,255,255,.4) inset}.passbook:before{content:'';position:absolute;left:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.08) 0 2px,transparent 2px 10px);pointer-events:none}
.cover{background:linear-gradient(160deg,var(--cover),var(--cover-dark));color:var(--gold-light);padding:40px 36px 28px;position:relative;border-bottom:6px solid var(--gold)}.cover:after{content:'';position:absolute;inset:10px;border:1px solid rgba(227,197,131,.35);pointer-events:none}.eyebrow{font:11px 'Roboto Mono',monospace;letter-spacing:3px;color:rgba(227,197,131,.72);margin-bottom:10px}.title{font:900 40px 'Noto Serif TC',serif;letter-spacing:4px;margin:0 0 18px;text-shadow:0 2px 0 rgba(0,0,0,.3)}.names{display:flex;align-items:center;gap:10px;font:700 19px 'Noto Serif TC',serif}.names input{width:6.5em;background:transparent;border:0;border-bottom:1px dashed rgba(227,197,131,.5);color:var(--gold-light);font:700 19px 'Noto Serif TC',serif;outline:none;padding:2px}.vs{opacity:.6;font:14px 'Roboto Mono',monospace}.book-no{margin-top:22px;font:12px 'Roboto Mono',monospace;color:rgba(227,197,131,.55);letter-spacing:1px}
.lockbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 28px;background:#3c1019;color:var(--gold-light);font-size:12px}.lockbtn{background:transparent;border:1px solid rgba(227,197,131,.55);color:var(--gold-light);padding:5px 13px;border-radius:999px;font-size:11.5px;cursor:pointer}.lockbtn:hover{background:rgba(227,197,131,.15)}
.balances{display:flex;background:var(--paper);border-bottom:1px solid var(--line)}.balance{flex:1;text-align:center;padding:24px 20px}.balance:first-child{border-right:1px dashed var(--line)}.bname{font-size:13px;color:var(--soft);margin-bottom:6px}.score{font:700 40px/1 'Roboto Mono',monospace}.score.pos{color:var(--right)}.score.neg{color:var(--wrong)}.score.zero{color:var(--ink)}.sub{margin-top:6px;font:11px 'Roboto Mono',monospace;color:var(--soft)}
.add{padding:22px 28px 26px;background:var(--paper2);border-bottom:1px solid var(--line)}h2{font:700 15px 'Noto Serif TC',serif;margin:0 0 14px}h2:before{content:'◆';color:var(--gold);font-size:10px;margin-right:8px}.row{display:flex;gap:8px;margin-bottom:12px}.btn{flex:1;padding:10px 8px;border:1.5px solid var(--line);background:var(--paper);border-radius:3px;font:500 13px 'Noto Sans TC',sans-serif;color:var(--soft);cursor:pointer}.btn.person.active{border-color:var(--cover);background:var(--cover);color:var(--gold-light);font-weight:700}.btn.type.right.active{border-color:var(--right);background:var(--right-bg);color:var(--right);font-weight:700}.btn.type.wrong.active{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);font-weight:700}
.points{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--soft)}.stepper{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--paper);border-radius:3px;overflow:hidden}.stepper button{width:34px;height:34px;border:0;background:#eee7d3;font-size:16px;font-weight:700;cursor:pointer}.stepper input{width:46px;border:0;background:transparent;text-align:center;font:700 15px 'Roboto Mono',monospace;outline:0}.input{width:100%;padding:10px 12px;margin-bottom:12px;border:1.5px solid var(--line);border-radius:3px;background:var(--paper);font:14px 'Noto Sans TC',sans-serif;color:var(--ink);outline:0}.input:focus{border-color:var(--gold)}.date{max-width:180px}.submit{display:flex;align-items:center;gap:14px;margin-top:2px}.stamp{border:2px solid var(--wrong);color:var(--wrong);background:transparent;font:900 15px 'Noto Serif TC',serif;letter-spacing:2px;padding:10px 22px;border-radius:999px;cursor:pointer;transform:rotate(-3deg)}.stamp:hover{background:var(--wrong);color:#fff}.hint{font-size:12px;color:var(--soft)}
.ledger{padding:22px 0 8px}.ledger h2{padding:0 28px}.empty{padding:30px 28px 60px;text-align:center;color:var(--soft);font-size:13.5px;line-height:1.8}.entry{display:grid;grid-template-columns:88px 70px 1fr 48px 38px;gap:8px;align-items:start;padding:12px 20px 12px 28px;border-top:1px dashed var(--line);font-size:13px}.entry .date{font:12px 'Roboto Mono',monospace;color:var(--soft)}.entry .person{font-weight:700}.entry .desc{line-height:1.5}.mark{font:900 13px 'Noto Serif TC',serif;padding:3px 8px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(-6deg);text-align:center}.mark.right{color:var(--right);background:var(--right-bg)}.mark.wrong{color:var(--wrong);background:var(--wrong-bg)}.del{border:0;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:11px}.footer{padding:16px 28px 22px;color:var(--soft);font-size:11px}.share{margin-top:8px}
@media(max-width:560px){body{padding:16px 8px 50px}.cover{padding:30px 22px 25px}.title{font-size:32px}.names{font-size:17px}.names input{font-size:17px;width:5.5em}.lockbar{padding:10px 20px}.add{padding:20px 18px 24px}.ledger h2{padding:0 18px}.entry{grid-template-columns:70px 55px 1fr 38px;gap:5px;padding-left:18px;padding-right:12px}.entry .del{grid-column:4}.hint{display:none}.date{max-width:none}}
</style>
</head>
<body>
<div class="passbook">
<section class="cover">
  <div class="eyebrow">RELATIONSHIP PASSBOOK · 感情存摺</div>
  <h1 class="title">感情存摺</h1>
  <div class="names"><input id="nameA" value="我"><span class="vs">×</span><input id="nameB" value="女朋友"></div>
  <div class="book-no">No. <span id="bookNo">LS-2026-001</span></div>
</section>
<section class="lockbar"><span id="status">載入緊...</span><button class="lockbtn" id="lockBtn" onclick="toggleLock()">解鎖編輯</button></section>
<section class="balances">
  <div class="balance"><div class="bname" id="bn0">我</div><div class="score zero" id="s0">0</div><div class="sub"><span id="r0">0</span> 對 · <span id="w0">0</span> 錯</div></div>
  <div class="balance"><div class="bname" id="bn1">女朋友</div><div class="score zero" id="s1">0</div><div class="sub"><span id="r1">0</span> 對 · <span id="w1">0</span> 錯</div></div>
</section>
<section class="add" id="addArea">
  <h2>新增一筆記錄</h2>
  <div class="row"><button class="btn person active" data-person="0">我</button><button class="btn person" data-person="1">女朋友</button><button class="btn type right active" data-type="right">✓ 對</button><button class="btn type wrong" data-type="wrong">× 錯</button></div>
  <div class="points"><span>呢件事值幾多分</span><div class="stepper"><button onclick="changePoints(-1)">−</button><input id="points" type="number" min="1" max="99" value="1"><button onclick="changePoints(1)">＋</button></div></div>
  <input class="input" id="desc" placeholder="呢件事係咩事？（例如：記得紀念日、講嘢冇禮貌...）">
  <input class="input date" id="date" type="date">
  <div class="submit"><button class="stamp" onclick="addEntry()">蓋 印</button><span class="hint">撳過個「對定錯」嘅事件就可以蓋印</span></div>
</section>
<section class="ledger"><h2>記錄</h2><div id="ledger"><div class="empty">存摺載入緊...</div></div></section>
<div class="footer">連結分享 · 對方睇到，只有限編輯後先可以編輯<div class="share">資料目前儲存在此瀏覽器；之後可接雲端同步。</div></div>
</div>
<script>
const KEY='relationship-passbook-v2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[];let person=0,type='right',locked=false;const $=id=>document.getElementById(id);
function init(){ $('date').value=new Date().toISOString().slice(0,10); bind(); render(); setTimeout(()=>{ $('status').textContent='準備完成'; },350); }
function bind(){document.querySelectorAll('.person').forEach(b=>b.onclick=()=>{person=+b.dataset.person;document.querySelectorAll('.person').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('nameA').oninput=()=>syncNames();$('nameB').oninput=()=>syncNames()}
function syncNames(){ $('bn0').textContent=$('nameA').value||'我';$('bn1').textContent=$('nameB').value||'女朋友';document.querySelector('[data-person="0"]').textContent=$('nameA').value||'我';document.querySelector('[data-person="1"]').textContent=$('nameB').value||'女朋友';}
function changePoints(n){$('points').value=Math.max(1,Math.min(99,+$('points').value+n))}
function addEntry(){if(locked)return alert('請先解鎖編輯');const d=$('desc').value.trim();if(!d)return alert('請先寫低件事');const p=Math.max(1,+$('points').value||1);data.push({id:Date.now(),person,type,points:p,desc:d,date:$('date').value});save();$('desc').value='';$('points').value=1;render();const b=document.querySelector('.stamp');b.classList.remove('stamped');void b.offsetWidth;b.classList.add('stamped')}
function removeEntry(id){if(locked)return alert('請先解鎖編輯');if(confirm('刪除呢筆記錄？')){data=data.filter(x=>x.id!==id);save();render()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){syncNames();let s=[0,0],r=[0,0],w=[0,0];data.forEach(e=>{if(e.type==='right'){s[e.person]+=e.points;r[e.person]++}else{s[e.person]-=e.points;w[e.person]++}});for(let i=0;i<2;i++){$('s'+i).textContent=s[i];$('s'+i).className='score '+(s[i]>0?'pos':s[i]<0?'neg':'zero');$('r'+i).textContent=r[i];$('w'+i).textContent=w[i]}if(!data.length){$('ledger').innerHTML='<div class="empty">存摺入緊緊...<br>新增第一筆記錄，開始你哋嘅感情存摺。</div>';return}$('ledger').innerHTML=data.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).map(e=>`<div class="entry"><div class="date">${e.date.replaceAll('-',' / ')}</div><div class="person">${e.person?($('nameB').value||'女朋友'):($('nameA').value||'我')}</div><div class="desc">${esc(e.desc)} <span style="color:#8b806d">${e.type==='right'?'+':'−'}${e.points}</span></div><div class="mark ${e.type}">${e.type==='right'?'對':'錯'}</div><button class="del" onclick="removeEntry(${e.id})">刪</button></div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggleLock(){locked=!locked;$('lockBtn').textContent=locked?'解鎖編輯':'鎖定編輯';$('status').textContent=locked?'目前為唯讀模式':'編輯模式已開啟';$('addArea').style.opacity=locked?.55:1}
init();
</script>
</body>
</html>
