<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Score ❤️</title>
<style>
:root{--bg:#fff7f8;--card:#fff;--text:#302630;--muted:#8c7d87;--line:#f1dfe4;--pink:#ff6f91;--green:#56a77a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:900px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:28px;font-weight:800}.sub,small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px #50233212}.score{text-align:center}.num{font-size:52px;font-weight:850}.bar{height:8px;background:#f5e8ec;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#ff9eb5);border-radius:99px}.actions{display:flex;gap:10px;margin:18px 0}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:var(--pink);color:white}.secondary{background:#fff;border:1px solid var(--line)}.title{font-size:18px;font-weight:800;margin-bottom:10px}.event{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.pts{font-weight:800}.plus{color:#c94f6d}.minus{color:var(--green)}.winner{text-align:center;font-weight:750;margin:12px}.modal{display:none;position:fixed;inset:0;background:#2d192359;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fff;border-radius:22px;padding:22px;width:min(520px,100%)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.right{text-align:right;margin-top:15px}@media(max-width:680px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand">Love Score ❤️</div><div class="sub">你們兩個人的「對錯帳簿」</div></div><button class="btn secondary" onclick="share()">🔗 分享</button></div>
<div class="grid"><div class="card score"><small>CowCow</small><div class="num" id="s0">0</div><div class="bar"><i id="b0" style="width:50%"></i></div></div><div class="card score"><small>女朋友</small><div class="num" id="s1">0</div><div class="bar"><i id="b1" style="width:50%"></i></div></div></div>
<div class="winner" id="winner">暫時打和 🤝</div><div class="actions"><button class="btn primary" onclick="openModal()">＋ 新增事件</button><button class="btn secondary" onclick="resetData()">重設示範資料</button></div>
<div class="card"><div class="title">最近事件</div><div id="events"></div></div></div>
<div class="modal" id="modal"><div class="box"><div class="title">新增事件 ❤️</div><div class="row"><div><label>誰</label><select id="who"><option value="0">CowCow</option><option value="1">女朋友</option></select></div><div><label>分數</label><select id="points"><option value="1">+1 小事</option><option value="3">+3 普通</option><option value="5">+5 大事</option><option value="-2">-2 做得好</option><option value="-5">-5 超級值得表揚</option></select></div></div><label>發生什麼事？</label><textarea id="desc" placeholder="例如：忘記買咖啡"></textarea><label>日期</label><input id="date" type="date"><div class="right"><button class="btn secondary" onclick="closeModal()">取消</button> <button class="btn primary" onclick="addEvent()">加入紀錄</button></div></div></div>
<script>
const KEY='love-score-v1';let data=JSON.parse(localStorage.getItem(KEY)||'null')||[{who:0,points:2,desc:'忘記買咖啡',date:'2026-08-12'},{who:1,points:3,desc:'遲到 20 分鐘',date:'2026-08-11'},{who:0,points:-2,desc:'主動洗碗',date:'2026-08-10'}];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(){let s=[0,0];data.forEach(e=>s[e.who]+=e.points);s.forEach((x,i)=>document.getElementById('s'+i).textContent=x);let t=Math.max(1,Math.abs(s[0])+Math.abs(s[1]));s.forEach((x,i)=>document.getElementById('b'+i).style.width=Math.abs(x)/t*100+'%');document.getElementById('winner').textContent=s[0]==s[1]?'暫時打和 🤝':s[0]>s[1]?'CowCow 暫時領先 🔥':'女朋友暫時領先 🔥';document.getElementById('events').innerHTML=data.length?data.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="event"><div><b>${esc(e.desc)}</b><br><small>${e.date} · ${e.who?'女朋友':'CowCow'}</small></div><div class="pts ${e.points<0?'minus':'plus'}">${e.points>0?'+':''}${e.points}</div></div>`).join(''):'<div class="sub">暫時沒有紀錄</div>'}
function openModal(){date.value=new Date().toISOString().slice(0,10);modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
function addEvent(){let d=desc.value.trim();if(!d)return alert('請輸入事件');data.push({who:+who.value,points:+points.value,desc:d,date:date.value});save();desc.value='';closeModal();render()}
function resetData(){if(confirm('確定重設示範資料？')){localStorage.removeItem(KEY);location.reload()}}
function share(){navigator.clipboard?.writeText(location.href).then(()=>alert('已複製網站 Link。')).catch(()=>prompt('複製這條 Link：',location.href))}render();
</script></body></html>
